# Render.com blueprint — deploys the whole app as one Docker web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: travel-timeline
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Headless cloud hosts have no GPU; force the SwiftShader WebGL path.
      - key: RENDER_FORCE_SOFTWARE
        value: "1"
      # Optional: enable the Supabase social layer (also needs the same
      # values as Docker build args so they're baked into the client bundle).
      # - key: VITE_SUPABASE_URL
      #   sync: false
      # - key: VITE_SUPABASE_ANON_KEY
      #   sync: false
