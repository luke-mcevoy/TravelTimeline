# Render.com blueprint — deploys the whole app as one Docker web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: travel-timeline
    runtime: docker
    # Free tier: 512 MB RAM, spins down when idle. Keep Chromium/video off
    # (serverVideoEnabled() is false when RENDER=true) or the process OOMs.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      # Social layer — set these in the Render dashboard (runtime, no rebuild).
      # Values live in client/.env.local; never commit the anon key to git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
