# Render.com blueprint — deploys the whole app as one Docker web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: travel-timeline
    runtime: docker
    # Free tier: 512 MB RAM, spins down when idle. Core app runs fine; the
    # server-side video exporter (Chromium) may need `starter` to avoid OOM.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Headless cloud hosts have no GPU; force the SwiftShader WebGL path.
      - key: RENDER_FORCE_SOFTWARE
        value: "1"
      # Social layer — set these in the Render dashboard (runtime, no rebuild).
      # Values live in client/.env.local; never commit the anon key to git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
