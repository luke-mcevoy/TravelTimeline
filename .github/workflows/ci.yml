name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t travel-timeline:ci .
      - name: Smoke test container
        run: |
          docker run -d --rm --name tt-ci -p 3001:3001 travel-timeline:ci
          sleep 5
          curl -sf http://localhost:3001/health
          curl -sf -o /dev/null http://localhost:3001/
          docker stop tt-ci
